  :root{
    --ink:#1B2C6B;
    --ink-deep:#152259;
    --gold:#E8921A;
    --red:#C0392B;
    --paper:#F7F6F2;
    --rule:rgba(27,44,107,.13);
    --mute:#6E7690;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet{
    width:100%;max-width:430px;
    background:var(--paper);
    border-top:3px solid var(--red);
    min-height:100dvh;
  }

  /* ── Bar: brand left, person switch right ─────────── */
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 14px;
  }
  .bar img{height:21px;width:auto;display:block;}
  .who{display:flex;gap:18px;}
  .who button{
    border:0;background:none;padding:3px 0 6px;
    font-family:'Open Sans',sans-serif;
    font-size:14.5px;font-weight:600;
    color:var(--mute);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .2s ease,border-color .2s ease;
  }
  .who button.on{color:var(--ink);border-bottom-color:var(--gold);}
  .who button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  /* ── Hero: the person ─────────────────────────────── */
  .hero{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:var(--ink-deep);
  }
  .hero img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;object-position:center 12%;
    display:block;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,
      rgba(21,34,89,.94) 0%,
      rgba(21,34,89,.72) 26%,
      rgba(21,34,89,.18) 56%,
      rgba(21,34,89,0) 78%);
  }
  .hero-txt{
    position:absolute;left:20px;right:20px;bottom:22px;z-index:2;
  }
  .hero-txt h1{
    margin:0;
    font-family:'Raleway',sans-serif;
    font-weight:800;
    font-size:clamp(30px,8.6vw,37px);
    line-height:1.02;
    letter-spacing:-1px;
    color:#fff;
  }
  .hero-txt p{
    margin:9px 0 0;
    font-size:14px;
    color:var(--gold);
  }
  .fade{animation:in .34s ease both;}
  @keyframes in{from{opacity:0}to{opacity:1}}

  /* ── Ways to reach them ───────────────────────────── */
  .reach{padding:4px 20px 0;}
  .reach a{
    display:flex;align-items:center;gap:15px;
    padding:17px 2px;
    border-bottom:1px solid var(--rule);
    text-decoration:none;color:var(--ink);
  }
  .reach a:last-child{border-bottom:0;}
  .reach a:active{background:rgba(27,44,107,.045);}
  .reach a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .reach svg{width:19px;height:19px;flex:none;}
  .reach span{
    font-size:16.5px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .reach em{font-style:normal;font-weight:400;color:var(--mute);}

  /* ── Contact code ─────────────────────────────────── */
  .code{
    margin:8px 20px 0;
    padding:26px 6px 24px;
    border-top:1px solid var(--rule);
    text-align:center;
  }
  .code figure{margin:0;}
  .code svg{
    width:100%;max-width:268px;height:auto;display:block;margin:0 auto;
  }
  .code figcaption{
    margin-top:18px;
    font-size:13px;line-height:1.55;color:var(--mute);
  }

  .colophon{
    padding:22px 20px 30px;
    text-align:center;
    font-size:12px;line-height:1.7;color:var(--mute);
  }

  @media(prefers-reduced-motion:reduce){
    .fade{animation:none;}
    .who button{transition:none;}
  }
</style>
</head>

        ^ EXP_TABLE[i - 6]

      while (n < 0) {
        n += 255;

      while (n >= 256) {

  function card(p){
    return ["BEGIN:VCARD","VERSION:3.0",
      "N:"+p.last+";"+p.first+";;;","FN:"+p.first+" "+p.last,
      "ORG:Learndigi Formation","TITLE:Co-fondateur",
      "TEL;TYPE=CELL:"+p.tel,"EMAIL:"+p.mail,
      "URL:"+SITE,"URL:"+LI,"URL:"+CAL,
      "END:VCARD",""].join("\r\n");
  }

  function reach(p){
    var items = [
      [S.tel , p.telShow          , "tel:"+p.tel   , 0],
      [S.mail, p.mail             , "mailto:"+p.mail, 0],
      [S.web , "learndigi.fr"     , SITE           , 1],
      [S.li  , "Learndigi sur LinkedIn", LI        , 1],
      [S.cal , "Prendre rendez-vous <em>30 min, en visio</em>", CAL, 1]
    ];
    document.getElementById("reach").innerHTML = items.map(function(i){
      return '<a href="'+i[2]+'"'+(i[3]?' target="_blank" rel="noopener"':'')+'>'
           + i[0] + '<span>' + i[1] + '</span></a>';
    }).join("");
  }

  function code(p){
    var q = qrcode(0,"M");
    q.addData(card(p)); q.make();
    document.getElementById("code").innerHTML =
      q.createSvgTag({cellSize:4, margin:12, scalable:true})
       .replace('fill="black"','fill="#1B2C6B"');
    document.getElementById("cap").textContent =
      "Faites scanner ce code pour enregistrer la fiche de " + p.first + ".";
  }

  window.pick = function(k){
    var p = P[k], hero = document.querySelector(".hero-txt"),
        shot = document.getElementById("shot");

    shot.src = p.shot;
    shot.alt = p.first + " " + p.last;
    document.getElementById("name").innerHTML = p.first + "<br>" + p.last;

    [shot, hero].forEach(function(el){
      el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
    });

    reach(p); code(p);

    document.getElementById("t-hugo").classList.toggle("on", k === "hugo");
    document.getElementById("t-matthieu").classList.toggle("on", k === "matthieu");
  };

  pick("hugo");
})();
